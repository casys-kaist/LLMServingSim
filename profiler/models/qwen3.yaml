# Qwen3 family — class catalog (dense *and* MoE decoder-only LLMs).
#
# One file for both shapes. vLLM implements them in separate modules
# (``qwen3.py`` / ``qwen3_moe.py``) whose classes differ only by a ``Moe``
# infix — ``Qwen3DecoderLayer`` vs ``Qwen3MoeDecoderLayer``,
# ``Qwen3Attention`` vs ``Qwen3MoeAttention`` — and are otherwise identical
# layer for layer. Splitting the catalog to match meant two 90%-duplicated
# files where a fix to one silently missed the other, so the ``within`` fields
# below list both alternatives and matching takes whichever the loaded
# checkpoint actually has.
#
# Which MLP runs is not decided here either: the simulator picks ``mlp_moe``
# or ``mlp_dense`` from the model config (``is_moe``), and the profiler skips
# the expert sweep for a checkpoint that declares no experts. So
# ``Qwen3-32B`` (dense) and ``Qwen3-30B-A3B`` (MoE) both resolve to this file
# and each gets only the layers it has.
#
# The attention block has per-head QK normalization, merged into a single
# ``qk_norm`` catalog entry. ``num_experts`` / ``top_k`` are read from the HF
# config at engine boot, not declared here.
#
# Canonical layer names mirror vLLM's own attribute names (see
# ../vllm/vllm/model_executor/models/qwen3.py and qwen3_moe.py).
#
# Qwen3.5 / 3.6 / 3.8 are a different architecture despite the name — they
# interleave gated DeltaNet with full attention and use ``GemmaRMSNorm`` — and
# live in qwen3_5.yaml.


model_types:
  - qwen3       # dense checkpoints (Qwen3-8B / 14B / 32B / ...)
  - qwen3_moe   # MoE checkpoints (Qwen3-30B-A3B / 235B-A22B / ...)


sequence:
  prologue:  [embedding]
  pre_attn:  [layernorm, qkv_proj, qk_norm, rotary_emb, attention]
  post_attn: [o_proj, layernorm]
  # Both are populated: the simulator emits whichever matches the
  # checkpoint's is_moe, so one sequence covers both shapes.
  mlp_dense: [gate_up_proj, act_fn, down_proj]
  mlp_moe:   [moe]
  head:      [final_layernorm, lm_head, sampler]


catalog:
  dense:
    embedding:
      vllm: VocabParallelEmbedding
    layernorm:
      vllm: RMSNorm
      within: [Qwen3DecoderLayer, Qwen3MoeDecoderLayer]
      tp_stable: true
    qkv_proj:
      vllm: QKVParallelLinear
    qk_norm:
      vllm: RMSNorm
      within: [Qwen3Attention, Qwen3MoeAttention]
      tp_stable: true
    rotary_emb:
      vllm: RotaryEmbedding
    o_proj:
      vllm: RowParallelLinear
      within: [Qwen3Attention, Qwen3MoeAttention]
    gate_up_proj:
      vllm: MergedColumnParallelLinear
    act_fn:
      vllm: SiluAndMul
    down_proj:
      # Qwen3's dense MLP reuses Qwen2's class.
      vllm: RowParallelLinear
      within: Qwen2MLP
    final_layernorm:
      vllm: RMSNorm
      within: [Qwen3ForCausalLM, Qwen3MoeForCausalLM]
      tp_stable: true
  per_sequence:
    lm_head:
      vllm: LogitsProcessor
    sampler:
      vllm: Sampler
      tp_stable: true
  attention:
    attention:
      vllm: Attention
  moe:
    # Present for the whole family; a dense checkpoint declares no experts and
    # the expert sweep is skipped for it.
    moe:
      vllm: Qwen3MoeSparseMoeBlock
